# Round 3 agent A: Countdown GRPO on a NON-Qwen model (Phi-4-mini-instruct, 3.8B, `dense` profile, GPU-proven in this repo) with LoRA,
# a researcher-designed reward (exact-answer correctness + a small brevity bonus paid ONLY when correct), sized to show a held-out
# learning effect inside ~1 node-hour of H100 (ledger evidence/ledgers/learning-proof.json, authorized 2026-10-11).
# Shape: 1 x 4 H100 slice (slices admit faster than 8; 0.5 node-s per second, so a 3600 s attempt books ~2,010 node-s).
# Data: own data dir with a 500-problem test set (tighter paired CI than 200) and 2,048 train problems (no epoch repeats).
#   `strl prepare experiments/r3a-cd-phi4.yaml` writes assets/countdown/data-r3a.
# grpo_norm_by_std: false keeps the 0.1 brevity bonus small in all-correct groups (std normalisation would rescale it to unit size);
# lr 2e-5 compensates for the un-normalised (smaller) advantages.
name: r3a-cd-phi4
description: Countdown, Phi-4-mini-instruct LoRA r32, 1x4 H100, correct + 0.1 brevity-if-correct, 500 held-out problems
extends: base/countdown.yaml

model:
  id: microsoft/Phi-4-mini-instruct
  revision: cfbefacb99257ffa30c83adab238a50856ac3083

finetune:
  mode: lora
  lora: {rank: 32, alpha: 64, dropout: 0.0, target_modules: all-linear}

environment:
  countdown:
    seed: 20261009
    train_size: 2048
    validation_size: 100
    test_size: 500
    # canary + r3a-a1-fb step 0-3: under the base prompt ("Think briefly, then give only the expression") Phi-4-mini answers in
    # 15-18 tokens with no search and solves ~2%: ask for the work instead (the brevity bonus still prefers short CORRECT answers)
    prompt: 'Using the numbers {numbers}, write an arithmetic expression that equals {target}. You may use +, -, *, / and parentheses; each number may be used at most once (you do not have to use all of them). Work it out step by step: try combinations and check each one''s value. When you have one that equals {target} exactly, give only that expression inside <answer></answer>, for example <answer>(1 + 2) * 3</answer>.'
    max_numbers: 4                # canary r3a-can1-fb: Phi-4-mini solved ~6% of 3-5-number problems (56% of answers used illegal numbers)
                                  # and only 25% of groups had signal; 3-4 numbers is the SIGNAL warning's "easier curriculum" lever

reward:
  components:
    - {fn: countdown_correct, weight: 1.0}
    - {fn: 'user_rewards.brevity:short_correct_bonus', weight: 1.0, bonus: 0.1, max_tokens: 1024}

compute:
  nodes: 1
  gpus_per_node: 4

inference:
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.5

algorithm:
  prompts_per_step: 16            # 16 x 16 = the same 256 rollouts; at a low base pass rate 16 samples/prompt leave far fewer
  minibatch_prompts: 16           # all-fail (zero-advantage) groups than 8 (plan SIGNAL)
  n_samples: 16
  micro_train_per_gpu: 4
  micro_forward_per_gpu: 8
  lr: 2.0e-05
  grpo_norm_by_std: false
  max_generate_length: 1024
  max_steps: 40

evaluation:
  interval_steps: 5
  checkpoint_interval_steps: 5
  final_eval: true
  eval_batch_size: 100
  eval_shards_per_model: 2        # 4 GPUs: base on 2, trained on 2, concurrently

budget:
  total_seconds: 5400              # only bounds attempt_max_seconds; the real budget is the ledger
  attempt_max_seconds: 5400        # books (5400 + 420) x 4/8 = 2,910 node-s
  ledger: evidence/ledgers/learning-proof.json

limits:
  max_nodes: 1
  max_attempt_seconds: 5400

tracking:
  group: r3a-countdown-phi4
  tags: ['env:countdown', 'finetune:lora', 'nodes:1', 'model:phi4-mini', 'reward:correct+brevity']

run:
  data_dir: assets/countdown/data-r3a-cot
